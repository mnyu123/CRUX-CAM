name: crux_cam
description: '클라이밍 영상과 사진을 분석·편집하는 CRUX-CAM 모바일 앱.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  image_picker: ^1.2.3
  video_player: ^2.14.1
  mime: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/pose_landmarker_full.task
    - assets/models/pose_landmarker_lite.task
